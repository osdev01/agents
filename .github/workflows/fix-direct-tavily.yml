name: Fix direct Tavily search

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace beforeTurn with direct Tavily search
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts")
          text = path.read_text()

          signature = "override async beforeTurn(ctx: TurnContext): Promise<TurnConfig | void> {"
          start = text.find(signature)
          if start < 0:
              raise SystemExit("beforeTurn signature not found")

          brace = text.find("{", start + len(signature) - 1)
          depth = 0
          end = None
          for i in range(brace, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("beforeTurn closing brace not found")

          method = '''override async beforeTurn(ctx: TurnContext): Promise<TurnConfig | void> {
            if (ctx.continuation) return;

            const latestUserMessage = [...ctx.messages]
              .reverse()
              .map(messageText)
              .find(Boolean);
            const explicitSearchQuery = latestUserMessage
              ? extractExplicitSearchQuery(latestUserMessage)
              : null;

            if (!explicitSearchQuery) return;

            const directSearchResult = await tavilySearch(this.env, explicitSearchQuery, {
              depth: "advanced",
              maxResults: 8
            });

            return {
              system: `${ctx.system}\\n\\n[MANDATORY DIRECT TAVILY SEARCH RESULT]\\n${directSearchResult}\\n\\nThe web search above was executed directly by the server. Treat it as authoritative web-search context for this user request. Do not claim that no web-search tool is available. Do not repeat the search unless the user explicitly asks for another search. Base current factual claims on these results and include the most relevant URLs.`
            };
          }'''

          text = text[:start] + method + text[end:]
          path.write_text(text)
          PY

      - name: Verify TypeScript source
        run: |
          grep -n "override async beforeTurn" examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts
          grep -n "MANDATORY DIRECT TAVILY SEARCH RESULT" examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts
          grep -n "directSearchResult = await tavilySearch" examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts
          git diff --check

      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-direct-tavily.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts .github/workflows/fix-direct-tavily.yml
          git diff --cached --check
          git commit -m "fix: finalize direct Tavily search"
          git push