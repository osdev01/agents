name: Add direct Think MCP bridge tools

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ConversationAgent
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts')
          text = path.read_text()
          if '  override getTools(): ToolSet {' in text:
              raise SystemExit('ConversationAgent already defines getTools; refusing duplicate patch')
          marker = '  override getModel() { const provider = createOpenAI({ apiKey: this.env.BAI_API_KEY, baseURL: this.env.BAI_BASE_URL }); return provider("laguna-s-2.1"); }'
          if marker not in text:
              raise SystemExit('getModel marker not found; refusing to patch')
          bridge = r'''\n  override getTools(): ToolSet {\n    return {\n      mcp_search: tool({\n        description: "Search the connected GitHub or Cloudflare MCP tool catalog. Use this before mcp_execute; never invent MCP tool names.",\n        inputSchema: jsonSchema<{ query: string; serverId?: string }>({\n          type: "object",\n          properties: {\n            query: { type: "string" },\n            serverId: { type: "string" }\n          },\n          required: ["query"],\n          additionalProperties: false\n        }),\n        execute: async ({ query, serverId }) => {\n          await this.mcp.waitForConnections({ timeout: 15000 });\n          const all = this.mcp.listTools(serverId ? { serverId } : undefined);\n          const terms = query.toLowerCase().split(/\\s+/).filter(Boolean);\n          const matches = all.map((item: any) => {\n            const haystack = [item.serverId, item.name, item.title, item.description].filter(Boolean).join(" ").toLowerCase();\n            const score = terms.reduce((n, term) => n + (haystack.includes(term) ? 1 : 0), 0);\n            return { item, score };\n          }).filter((x: any) => x.score > 0).sort((a: any, b: any) => b.score - a.score).slice(0, 20);\n          return { count: matches.length, tools: matches.map((x: any) => ({ serverId: x.item.serverId, name: x.item.name, title: x.item.title ?? x.item.name, description: x.item.description ?? "", inputSchema: x.item.inputSchema })) };\n        }\n      }),\n      mcp_execute: tool({\n        description: "Execute an exact MCP tool returned by mcp_search using its serverId, name, and arguments.",\n        inputSchema: jsonSchema<{ serverId: string; name: string; arguments: Record<string, unknown> }>({\n          type: "object",\n          properties: {\n            serverId: { type: "string" },\n            name: { type: "string" },\n            arguments: { type: "object", additionalProperties: true }\n          },\n          required: ["serverId", "name", "arguments"],\n          additionalProperties: false\n        }),\n        execute: async ({ serverId, name, arguments: args }) => {\n          await this.mcp.waitForConnections({ timeout: 15000 });\n          const selected = this.mcp.listTools().find((item: any) => item.serverId === serverId && item.name === name);\n          if (!selected) throw new Error(`MCP tool not found: ${serverId}/${name}. Run mcp_search again.`);\n          return await this.mcp.callTool({ serverId, name, arguments: args });\n        }\n      })\n    };\n  }\n'''
          text = text.replace(marker, marker + bridge, 1)
          path.write_text(text)
          PY
      - name: Validate
        run: |
          grep -n "override getTools\|mcp_search\|mcp_execute" examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts
      - name: Commit and remove fixer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts .github/workflows/mcp-direct-tools.yml
          git rm .github/workflows/mcp-direct-tools.yml
          git commit -m "fix: expose MCP bridge directly from ConversationAgent"
          git push origin HEAD:main
