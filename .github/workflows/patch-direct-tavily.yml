name: Apply direct Tavily search patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: apply direct Tavily search') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ConversationAgent
        env:
          TARGET: examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["TARGET"])
          text = path.read_text()
          marker = "MANDATORY DIRECT TAVILY SEARCH RESULT"

          if marker in text:
              print("Direct Tavily patch already present")
              raise SystemExit(0)

          injected = """
              if (!ctx.continuation) {
                const latestUserMessage = [...ctx.messages]
                  .reverse()
                  .map(messageText)
                  .find(Boolean);
                const explicitSearchQuery = latestUserMessage
                  ? extractExplicitSearchQuery(latestUserMessage)
                  : null;

                if (explicitSearchQuery) {
                  const directSearchResult = await tavilySearch(this.env, explicitSearchQuery, {
                    depth: "advanced",
                    maxResults: 8
                  });

                  return {
                    system: `${ctx.system}\\n\\n[${marker}]\\n${directSearchResult}\\n\\nThe web search above was executed directly by the server. Treat it as authoritative web-search context for this user request. Do not claim that no web-search tool is available. Do not repeat the search unless the user explicitly asks for another search. Base current factual claims on these results and include the most relevant URLs.`
                  };
                }
              }
          """

          pos = text.find("beforeTurn(")
          if pos >= 0:
              brace = text.find("{", pos)
              if brace < 0:
                  raise SystemExit("Could not locate beforeTurn body")
              prefix = text[max(0, pos-50):pos]
              if "async " not in prefix:
                  text = text[:pos] + "async " + text[pos:]
                  pos += len("async ")
                  brace = text.find("{", pos)
              text = text[:brace+1] + injected + text[brace+1:]
          else:
              insert_at = text.rfind("\n}")
              if insert_at < 0:
                  raise SystemExit("Could not locate ConversationAgent class closing brace")
              method = """

            override async beforeTurn(ctx: TurnContext): Promise<TurnConfig | void> {
          """ + injected + """
            }
          """
              text = text[:insert_at] + method + text[insert_at:]

          path.write_text(text)
          print("Patched", path)
          PY

      - name: Verify patch
        run: |
          grep -n "MANDATORY DIRECT TAVILY SEARCH RESULT" examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts
          grep -n "async beforeTurn" examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts
          git diff --check

      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/patch-direct-tavily.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts .github/workflows/patch-direct-tavily.yml
          git diff --cached --check
          git commit -m "chore: apply direct Tavily search"
          git push