name: Add search report

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch conversation agent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts')
