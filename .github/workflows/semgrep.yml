      try {
        await this.addMcpServer("GitHub", "https://api.githubcopilot.com/mcp/", {
          id: "github",
          transport: {
            type: "streamable-http",
            headers: { Authorization: `Bearer ${env.GITHUB_MCP_TOKEN}` },
          },
          retry: { maxAttempts: 3, baseDelayMs: 500 },
        });
