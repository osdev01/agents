          PY

      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/chat-sdk-messenger/src/intelligence/conversation-agent.ts .github/workflows/semgrep.yml .github/workflows/patch-mcp-connectors.yml .github/workflows/patch-mcp-connectors-trigger
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect GitHub and Cloudflare through MCP"
          git push

  gate:
    name: gate
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAY=$(date -u +%-d)
          if [ "$DAY" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled run: day-of-month $DAY is not in the first 7 days."
          fi
  semgrep:
    name: semgrep-oss
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: cache-semgrep
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: semgrep-1.160.0-${{ runner.os }}
      - if: steps.cache-semgrep.outputs.cache-hit != 'true'
        run: pip install --user semgrep==1.160.0
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: semgrep scan --config=auto
